<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18231c" />
    <meta
      name="description"
      content="Encontre a Slicer na Shopee e fale com a gente sobre pedidos especiais. Sua casa, camada por camada."
    />
    <meta property="og:title" content="Slicer | Links oficiais" />
    <meta
      property="og:description"
      content="Sua casa, camada por camada. Conheça nossos produtos e canais oficiais."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/slicer-perfil-redes-sociais.png" />
    <title>Slicer | Links oficiais</title>
    <link rel="icon" href="assets/slicer-simbolo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <div class="ambient-layer ambient-layer--one" aria-hidden="true"></div>
      <div class="ambient-layer ambient-layer--two" aria-hidden="true"></div>

      <section class="profile" aria-labelledby="page-title">
        <header class="profile__header">
          <img
            class="profile__logo"
            src="assets/slicer-assinatura-clara.svg"
            alt="Slicer — Sua casa, camada por camada"
          />
          <h1 id="page-title" class="sr-only">Links oficiais da Slicer</h1>
          <p class="profile__intro">
            Impressão 3D para transformar ideias em peças que fazem parte da sua casa.
          </p>
        </header>

        <nav class="links" aria-label="Links oficiais da Slicer">
          <a
            class="link-card link-card--primary"
            href="https://br.shp.ee/FXp9qjkQ"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z" />
                <path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12v8.5" />
              </svg>
            </span>
            <span class="link-card__copy">
              <strong>Produto em destaque</strong>
              <small>Conheça nossa escolha especial</small>
            </span>
            <span class="link-card__arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="link-card"
            href="https://shopee.com.br/slicerimpressoes"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M5 8h14l-1 12H6L5 8Z" />
                <path d="M9 9V6a3 3 0 0 1 6 0v3" />
                <path d="M14.6 12.5c-.7-.5-1.5-.7-2.5-.7-1.2 0-2 .5-2 1.3 0 2 4.5.7 4.5 3.2 0 .9-.9 1.7-2.5 1.7-1 0-1.9-.3-2.7-.9" />
              </svg>
            </span>
            <span class="link-card__copy">
              <strong>Loja na Shopee</strong>
              <small>Compre pelo marketplace</small>
            </span>
            <span class="link-card__arrow" aria-hidden="true">↗</span>
          </a>

          <a
            class="link-card"
            href="https://wa.me/5551995120884"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-card__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M20 11.6a8 8 0 0 1-11.8 7L4 20l1.4-4.1A8 8 0 1 1 20 11.6Z" />
                <path d="M9 8.4c.3 2.8 2.2 4.8 5 5.3" />
                <path d="m9 8.4.7-.6M14 13.7l.7-.8" />
              </svg>
            </span>
            <span class="link-card__copy">
              <strong>Pedidos especiais</strong>
              <small>Fale com a gente pelo WhatsApp</small>
            </span>
            <span class="link-card__arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <footer class="profile__footer">
          <img src="assets/slicer-simbolo.svg" alt="" aria-hidden="true" />
          <span>Feito em camadas. Pensado nos detalhes.</span>
        </footer>
      </section>
    </main>
  </body>
</html>
